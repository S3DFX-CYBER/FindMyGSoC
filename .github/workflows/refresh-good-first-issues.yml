name: 🔄 Refresh Good First Issues + UI Data

on:
  schedule:
    # Daily at 03:00 UTC (08:30 IST). The dataset only needs to be a day fresh,
    # and a single run costs far fewer Actions minutes than four.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Smoke test: check only the first N organisations and publish nothing."
        required: false
        default: ""

concurrency:
  group: refresh-good-first-issues
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  refresh:
    # Scope: the good first issue dataset and the two files derived from it.
    # This job must never write data/mentors.json (hand-curated, see #2104) or
    # touch sw.js — an automated rewrite of those cost months of verified
    # mentor contact data.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          # Keep the token out of .git/config: npm ci and the node scripts run
          # later and should not be able to read a credential from disk.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Prepare data directory
        run: |
          mkdir -p data
          [ -f data/issues.json ] || echo "{}" > data/issues.json
          [ -f data/last-updated.json ] || echo "{}" > data/last-updated.json

      # A dispatch with `limit` is a smoke test: it checks a slice and must not
      # publish a truncated dataset.
      - name: Fetch good first issues
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GFI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GFI_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "${GFI_LIMIT}" ]; then
            echo "Smoke test: checking ${GFI_LIMIT} organisations, publishing nothing."
            node agent/scripts/fetch-issues.js --limit "${GFI_LIMIT}" --dry-run
          else
            node agent/scripts/fetch-issues.js
          fi

      - name: Generate UI cache
        run: node agent/scripts/generate-ui-cache.js

      - name: Ensure generated files exist
        run: |
          mkdir -p data
          [ -f data/ui-summary.json ] || echo '{}' > data/ui-summary.json
          [ -f data/org-stats.json ] || echo '{}' > data/org-stats.json

      - name: Update refresh timestamp
        if: inputs.limit == ''
        run: |
          echo "{\"updatedAt\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/last-updated.json

      # Always runs: the issue dataset is the only thing this job publishes.
      - name: Validate issue dataset
        run: |
          node -e "
            const d = require('./data/issues.json');
            if (!Array.isArray(d.issues)) throw new Error('issues is not an array');
            if (!d.issues.every((i) => i && typeof i.url === 'string' && typeof i.org === 'string')) {
              throw new Error('issue entries are malformed');
            }
            console.log('issues.json ok: ' + d.issues.length + ' issues');
          "

      # Publishing only happens from main, on a real run. A dispatch from a
      # feature branch must never push that branch tip to main, and a smoke
      # test must never publish its slice.
      - name: Commit refreshed data
        id: commit
        if: github.ref == 'refs/heads/main' && inputs.limit == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json data/ui-summary.json data/last-updated.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dataset is already up to date."
            exit 0
          fi
          git commit -m "chore(data): refresh good first issues for $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site reads the dataset through /api/gfi, which is backed by this
      # branch. It is deliberately not protected, so the daily refresh lands
      # without a reviewer in the loop.
      - name: Publish dataset branch
        id: publish
        if: steps.commit.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.GFI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/data/latest

      # Best effort: also refresh the copy committed on main, so the repo and
      # the static fallback stay current. Branch protection rejects this unless
      # a bypass rule or GFI_PUSH_TOKEN is configured; that is not fatal because
      # the site already reads data/latest.
      - name: Push refresh to main
        id: push
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.GFI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Good first issues refresh"
            if [ -f data/issues.json ]; then
              node -e "
                const d = require('./data/issues.json');
                const issues = Array.isArray(d.issues) ? d.issues : [];
                const orgs = new Set(issues.map((i) => i.org));
                console.log('- issues: ' + issues.length);
                console.log('- organisations with issues: ' + orgs.size);
                console.log('- dataset timestamp: ' + (d.updated_at || 'unknown'));
              "
            fi
            echo "- committed: ${{ steps.commit.outputs.changed || 'false' }}"
            echo "- published to data/latest: ${{ steps.publish.outcome || 'skipped' }}"
            echo "- pushed to main: ${{ steps.push.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
