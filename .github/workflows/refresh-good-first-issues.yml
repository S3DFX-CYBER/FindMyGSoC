name: 🔄 Refresh Good First Issues + UI Data

on:
  schedule:
    # Daily at 03:00 UTC (08:30 IST). The dataset only needs to be a day fresh,
    # and a single run costs far fewer Actions minutes than four.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only check the first N organisations (smoke test). Leave blank for all."
        required: false
        default: ""

concurrency:
  group: refresh-good-first-issues
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          # Optional: add a GFI_PUSH_TOKEN secret (a fine-grained PAT with
          # contents:write) when main is protected and the workflow must push
          # to it directly. Without it the job falls back to opening a PR.
          token: ${{ secrets.GFI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Prepare data directory
        run: |
          mkdir -p data
          [ -f data/issues.json ] || echo "{}" > data/issues.json
          [ -f data/mentors.json ] || echo "{}" > data/mentors.json
          [ -f data/last-updated.json ] || echo "{}" > data/last-updated.json

      - name: Fetch good first issues
        id: fetch
        run: node agent/scripts/fetch-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GFI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GFI_LIMIT: ${{ inputs.limit }}

      # Mentor scraping is best effort: it reads project wikis and mailing-list
      # pages that go down regularly, and a failure there must not stop the
      # issue dataset from being published.
      - name: Extract mentor contacts
        id: mentors
        continue-on-error: true
        run: node agent/scripts/extract-mentors.js

      - name: Validate mentor data
        if: steps.mentors.outcome == 'success'
        run: node agent/scripts/validate-mentors.js

      - name: Generate UI cache
        run: node agent/scripts/generate-ui-cache.js

      - name: Ensure generated files exist
        run: |
          mkdir -p data
          [ -f data/ui-summary.json ] || echo '{}' > data/ui-summary.json
          [ -f data/org-stats.json ] || echo '{}' > data/org-stats.json

      - name: Update refresh timestamp
        run: |
          echo "{\"updatedAt\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/last-updated.json

      # Only meaningful when the mentor dataset was actually regenerated: the
      # committed mentors.json carries schema drift that this job does not own.
      - name: Validate generated JSON data
        if: steps.mentors.outcome == 'success'
        run: npm run validate:data

      - name: Bump service worker cache version
        run: |
          if [ -f sw.js ]; then
            TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
            sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'gsoc-finder-${TIMESTAMP}'/" sw.js
          fi

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json data/mentors.json data/ui-summary.json data/last-updated.json sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dataset is already up to date."
            exit 0
          fi
          git commit -m "chore(data): refresh good first issues for $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site reads the dataset through /api/gfi, which is backed by this
      # branch. It is deliberately not protected, so the daily refresh lands
      # without a reviewer in the loop.
      - name: Publish dataset branch
        id: publish
        if: steps.commit.outputs.changed == 'true'
        run: git push --force origin HEAD:refs/heads/data/latest

      # Best effort: also refresh the copy committed on main, so the repo and
      # any static fallback stay current. Branch protection rejects this unless
      # a bypass rule or GFI_PUSH_TOKEN is configured; that is not fatal.
      - name: Push refresh to main
        id: push
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: git push origin HEAD:main

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Good first issues refresh"
            if [ -f data/issues.json ]; then
              node -e "
                const d = require('./data/issues.json');
                const issues = Array.isArray(d.issues) ? d.issues : [];
                const orgs = new Set(issues.map((i) => i.org));
                console.log('- issues: ' + issues.length);
                console.log('- organisations with issues: ' + orgs.size);
                console.log('- dataset timestamp: ' + (d.updated_at || 'unknown'));
              "
            fi
            echo "- committed: ${{ steps.commit.outputs.changed || 'false' }}"
            echo "- published to data/latest: ${{ steps.publish.outcome || 'skipped' }}"
            echo "- pushed to main: ${{ steps.push.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
